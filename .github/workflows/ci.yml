name: CI Build Check

on:
  push:
    branches: [ "user-feature" ]
  pull_request:
    branches: [ "user-feature" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: |
          cd backend
          docker build -t teamsync-backend:latest .

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Build Frontend Image
        run: |
          cd "teamsync-pro-團隊同步1"
          docker build -t teamsync-frontend:latest .
